<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
{% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}

<!-- Applied before first paint so an explicitly chosen theme never flashes the
     other palette on load. Must stay inline and blocking in <head>. -->
<script>
  (function () {
    try {
      var saved = localStorage.getItem('legal-theme');
      if (saved === 'dark' || saved === 'light') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    } catch (e) { /* private mode / storage disabled: fall back to OS palette */ }
  })();
</script>

<style>
  /* Light palette (default). */
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --bg-subtle: #f6f8fa;
    --text: #1f2328;
    --text-muted: #59636e;
    --heading: #010409;
    --link: #0969da;
    --border: #d1d9e0;
    --shadow: rgba(31, 35, 40, 0.12);
  }

  /* Dark palette follows the OS by default... */
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --bg-subtle: #151b23;
      --text: #d1d7e0;
      --text-muted: #9198a1;
      --heading: #f0f6fc;
      --link: #4493f8;
      --border: #3d444d;
      --shadow: rgba(1, 4, 9, 0.5);
    }
  }

  /* ...and these explicit attributes override it in BOTH directions, so the
     toggle can force light on a dark OS and dark on a light OS. They are
     declared after the media query so they win on equal specificity. */
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #ffffff;
    --bg-subtle: #f6f8fa;
    --text: #1f2328;
    --text-muted: #59636e;
    --heading: #010409;
    --link: #0969da;
    --border: #d1d9e0;
    --shadow: rgba(31, 35, 40, 0.12);
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d1117;
    --bg-subtle: #151b23;
    --text: #d1d7e0;
    --text-muted: #9198a1;
    --heading: #f0f6fc;
    --link: #4493f8;
    --border: #3d444d;
    --shadow: rgba(1, 4, 9, 0.5);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0 1.25rem 5rem;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans",
                 Helvetica, Arial, sans-serif;
    font-size: 1rem;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }

  main {
    max-width: 46rem;
    margin: 0 auto;
    padding-top: 1.5rem;
  }

  h1, h2, h3, h4, h5, h6 {
    color: var(--heading);
    line-height: 1.25;
    margin: 2rem 0 1rem;
    font-weight: 600;
  }

  h1 { font-size: 1.9rem; margin-top: 1rem; }
  h2 {
    font-size: 1.4rem;
    padding-bottom: 0.3rem;
    border-bottom: 1px solid var(--border);
  }
  h3 { font-size: 1.15rem; }
  h4, h5, h6 { font-size: 1rem; }

  p, ul, ol, blockquote, table { margin: 0 0 1rem; }

  a {
    color: var(--link);
    text-decoration: none;
  }
  a:hover, a:focus-visible { text-decoration: underline; }

  strong { color: var(--heading); font-weight: 600; }

  ul, ol { padding-left: 1.75rem; }
  li + li { margin-top: 0.25rem; }
  li > ul, li > ol { margin: 0.25rem 0 0.5rem; }

  blockquote {
    margin-left: 0;
    padding: 0 1rem;
    color: var(--text-muted);
    border-left: 0.25rem solid var(--border);
  }

  hr {
    height: 1px;
    margin: 2rem 0;
    border: 0;
    background: var(--border);
  }

  code, pre {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
                 "Liberation Mono", monospace;
    font-size: 0.875em;
  }

  code {
    padding: 0.2em 0.4em;
    background: var(--bg-subtle);
    border-radius: 6px;
  }

  pre {
    padding: 1rem;
    overflow-x: auto;
    background: var(--bg-subtle);
    border-radius: 6px;
  }
  pre code { padding: 0; background: none; }

  /* Legal docs use tables for data-collection disclosures — these must stay
     readable on a phone, so the table scrolls inside its own container
     rather than forcing the page to scroll sideways. */
  .table-wrap {
    overflow-x: auto;
    margin: 0 0 1rem;
    -webkit-overflow-scrolling: touch;
  }

  table {
    border-collapse: collapse;
    width: 100%;
    margin: 0;
  }

  th, td {
    padding: 0.5rem 0.85rem;
    border: 1px solid var(--border);
    text-align: left;
    vertical-align: top;
  }

  th {
    background: var(--bg-subtle);
    color: var(--heading);
    font-weight: 600;
  }

  img { max-width: 100%; height: auto; }

  /* Theme toggle */
  .theme-toggle {
    position: fixed;
    top: 0.9rem;
    right: 0.9rem;
    z-index: 10;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.45rem 0.7rem;
    font: inherit;
    font-size: 0.85rem;
    line-height: 1;
    color: var(--text);
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: 999px;
    box-shadow: 0 1px 3px var(--shadow);
    cursor: pointer;
  }
  .theme-toggle:hover { border-color: var(--text-muted); }
  .theme-toggle:focus-visible {
    outline: 2px solid var(--link);
    outline-offset: 2px;
  }

  .theme-toggle .icon { font-size: 1rem; }

  /* Each palette shows only the affordance for the palette it switches TO. */
  .theme-toggle .to-dark { display: inline; }
  .theme-toggle .to-light { display: none; }
  @media (prefers-color-scheme: dark) {
    .theme-toggle .to-dark { display: none; }
    .theme-toggle .to-light { display: inline; }
  }
  :root[data-theme="light"] .theme-toggle .to-dark { display: inline; }
  :root[data-theme="light"] .theme-toggle .to-light { display: none; }
  :root[data-theme="dark"] .theme-toggle .to-dark { display: none; }
  :root[data-theme="dark"] .theme-toggle .to-light { display: inline; }

  /* Toggle is useless without JS, and its label would then be wrong. */
  .no-js .theme-toggle { display: none; }

  footer {
    max-width: 46rem;
    margin: 3rem auto 0;
    padding-top: 1.25rem;
    border-top: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 0.85rem;
  }
  footer a { color: var(--text-muted); text-decoration: underline; }

  @media print {
    .theme-toggle { display: none; }
    body { padding: 0; color: #000; background: #fff; }
  }
</style>
</head>
<body class="no-js">

<button type="button" class="theme-toggle" id="theme-toggle" aria-live="polite">
  <span class="icon to-dark" aria-hidden="true">&#9789;</span><span class="to-dark">Dark</span>
  <span class="icon to-light" aria-hidden="true">&#9788;</span><span class="to-light">Light</span>
</button>

<main>
  {{ content }}
</main>

<footer>
  <p>
    &copy; {{ 'now' | date: "%Y" }} Javi Rozal&eacute;n. All rights reserved.
    &middot; <a href="{{ '/' | relative_url }}">All legal documents</a>
  </p>
</footer>

<script>
  (function () {
    var root = document.documentElement;
    var body = document.body;
    var btn = document.getElementById('theme-toggle');

    body.classList.remove('no-js');

    function effectiveTheme() {
      var explicit = root.getAttribute('data-theme');
      if (explicit === 'dark' || explicit === 'light') return explicit;
      return window.matchMedia('(prefers-color-scheme: dark)').matches
        ? 'dark'
        : 'light';
    }

    function syncLabel() {
      var next = effectiveTheme() === 'dark' ? 'light' : 'dark';
      btn.setAttribute('aria-label', 'Switch to ' + next + ' mode');
    }

    btn.addEventListener('click', function () {
      var next = effectiveTheme() === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('legal-theme', next); } catch (e) { /* no-op */ }
      syncLabel();
    });

    // Track the OS while no explicit choice is stored, so the label stays honest.
    window.matchMedia('(prefers-color-scheme: dark)')
      .addEventListener('change', syncLabel);

    syncLabel();

    // Kramdown emits bare <table>, so wrap each one to keep wide disclosure
    // tables scrolling inside themselves instead of widening the page.
    var tables = document.querySelectorAll('main > table');
    for (var i = 0; i < tables.length; i++) {
      var t = tables[i];
      var wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      t.parentNode.insertBefore(wrap, t);
      wrap.appendChild(t);
    }
  })();
</script>

</body>
</html>
